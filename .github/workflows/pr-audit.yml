name: PR Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sol'
      - '**.js'
      - '**.ts'
      - 'contracts/**'
      - 'auditor/**'
      - 'script/**'

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  audit-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=false
          fi
      
      # ─── Get Changed Files Safely ──────────
      - name: Validate base ref
        id: validate_ref
        run: |
          BASE_REF="${{ github.base_ref }}"
          
          # Validate ref format (alphanumeric, dots, hyphens, underscores, slashes)
          if ! echo "$BASE_REF" | grep -qE '^[a-zA-Z0-9._/-]+$'; then
            echo "::error::Invalid base ref: $BASE_REF"
            exit 1
          fi
          
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
      
      - name: Get changed files
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${{ steps.validate_ref.outputs.base_ref }}...HEAD" 2>/dev/null | grep -E '\.(sol|js|ts|rs)$' | head -100 || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No contract or script files changed"
            echo "files=" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            # Validate each file path
            VALID_FILES=""
            while IFS= read -r file; do
              if echo "$file" | grep -qE '^[a-zA-Z0-9._/-]+\.(sol|js|ts|rs)$'; then
                VALID_FILES="${VALID_FILES}${VALID_FILES:+,}$file"
              fi
            done <<< "$CHANGED_FILES"
            
            echo "files=$VALID_FILES" >> $GITHUB_OUTPUT
            COUNT=$(echo "$VALID_FILES" | tr ',' '\n' | grep -c . || echo 0)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Changed files: $VALID_FILES"
          fi
      
      # ─── Run Security Scan ─────────────────
      - name: Scan changed contracts
        if: steps.changed.outputs.count > 0
        id: scan
        run: |
          echo "Scanning ${{ steps.changed.outputs.count }} changed file(s)..."
          
          mkdir -p reports
          
          # Initialize empty report
          echo '[]' > reports/pr-scan.json
          
          IFS=',' read -ra FILE_ARRAY <<< "${{ steps.changed.outputs.files }}"
          for file in "${FILE_ARRAY[@]}"; do
            file=$(echo "$file" | xargs)
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "::group::Analyzing $file"
              
              # Run antivirus source code analysis
              if node -e "
                const fs = require('fs');
                const AntivirusScanner = require('./auditor/antivirus');
                const scanner = new AntivirusScanner({});
                const source = fs.readFileSync('$file', 'utf8');
                const vulns = scanner._scanSourceCode ? scanner._scanSourceCode(source) : [];
                const report = vulns.length > 0 ? JSON.stringify(vulns) : '[]';
                fs.writeFileSync('reports/pr-scan.json', report);
              " 2>&1; then
                echo "Scan complete for $file"
              else
                echo "::warning::Scan failed for $file"
              fi
              
              echo "::endgroup::"
            fi
          done
          
          echo "Scan complete"
      
      - name: Generate audit report
        id: report
        run: |
          if [ -f "reports/pr-scan.json" ]; then
            if ! jq empty reports/pr-scan.json 2>/dev/null; then
              echo "::warning::Invalid scan report"
              echo "issues=0" >> $GITHUB_OUTPUT
              echo "critical=0" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            ISSUES=$(jq 'length // 0' reports/pr-scan.json)
            CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length // 0' reports/pr-scan.json)
            HIGH=$(jq '[.[] | select(.severity == "high")] | length // 0' reports/pr-scan.json)
            
            echo "issues=$ISSUES" >> $GITHUB_OUTPUT
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            
            echo "Issues: $ISSUES (Critical: $CRITICAL, High: $HIGH)"
          else
            echo "issues=0" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
          fi
      
      # ─── Sticky PR Comment ─────────────────
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 PR Security Audit\n\n';
            comment += `**Scan Time:** ${new Date().toISOString()}\n`;
            comment += `**Files Changed:** ${{ steps.changed.outputs.count }}\n\n`;
            
            const issues = parseInt('${{ steps.report.outputs.issues }}') || 0;
            const critical = parseInt('${{ steps.report.outputs.critical }}') || 0;
            const high = parseInt('${{ steps.report.outputs.high }}') || 0;
            
            if (issues === 0) {
              comment += '✅ **No security issues detected**\n\n';
            } else {
              comment += '| Severity | Count |\n';
              comment += '|----------|-------|\n';
              if (critical > 0) comment += `| 🔴 Critical | ${critical} |\n`;
              if (high > 0) comment += `| 🟠 High | ${high} |\n`;
              comment += `| **Total** | **${issues}** |\n\n`;
              
              if (critical > 0) {
                comment += '🚨 **Critical issues must be fixed before merging.**\n\n';
              }
              
              // Add detailed findings
              if (fs.existsSync('reports/pr-scan.json')) {
                const report = JSON.parse(fs.readFileSync('reports/pr-scan.json', 'utf8'));
                const criticals = report.filter(v => v.severity === 'critical');
                const highs = report.filter(v => v.severity === 'high');
                
                if (criticals.length > 0) {
                  comment += '### 🚨 Critical\n\n';
                  for (const v of criticals.slice(0, 5)) {
                    comment += `- **${v.type}** (line ${v.lines?.[0] || '?'}): ${v.description}\n`;
                    comment += `  → ${v.recommendation || 'Manual review required'}\n`;
                  }
                  comment += '\n';
                }
                
                if (highs.length > 0) {
                  comment += '### ⚠️ High\n\n';
                  for (const v of highs.slice(0, 5)) {
                    comment += `- **${v.type}** (line ${v.lines?.[0] || '?'}): ${v.description}\n`;
                    comment += `  → ${v.recommendation || 'Manual review required'}\n`;
                  }
                  comment += '\n';
                }
              }
            }
            
            comment += '### 📁 Changed Files\n\n';
            const files = '${{ steps.changed.outputs.files }}'.split(',').filter(Boolean);
            if (files.length > 0) {
              for (const f of files.slice(0, 20)) {
                comment += `- \`${f}\`\n`;
              }
              if (files.length > 20) {
                comment += `- ...and ${files.length - 20} more\n`;
              }
            }
            comment += '\n';
            
            comment += '---\n';
            comment += `*[View Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) | SmartContractAudit PR Audit*\n`;
            
            // Sticky comment logic
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('PR Security Audit')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Created new comment');
            }
      
      # ─── Status Check ──────────────────────
      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const critical = parseInt('${{ steps.report.outputs.critical }}') || 0;
            
            const state = critical > 0 ? 'failure' : 'success';
            const description = critical > 0
              ? `${critical} critical security issue(s) — fix required`
              : 'Security audit passed';
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: state,
              context: 'Security Audit (SmartContractAudit)',
              description: description,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      
      # ─── Block on Critical ─────────────────
      - name: Block merge on critical issues
        if: steps.report.outputs.critical > 0
        run: |
          echo "::error::🚨 ${{ steps.report.outputs.critical }} critical security issue(s) detected!"
          echo "::error::Please fix all critical issues before merging this PR."
          echo ""
          echo "Review the PR comment for details or check the workflow artifacts."
          exit 1
      
      - name: Job Summary
        if: always()
        run: |
          {
            echo "# 🔍 PR Security Audit"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Files Changed | ${{ steps.changed.outputs.count }} |"
            echo "| Issues Found | ${{ steps.report.outputs.issues || 0 }} |"
            echo "| Critical | ${{ steps.report.outputs.critical || 0 }} |"
            echo "| High | ${{ steps.report.outputs.high || 0 }} |"
            echo "| Status | ${{ steps.report.outputs.critical > 0 && '🔴 Blocked' || '✅ Passed' }} |"
          } >> $GITHUB_STEP_SUMMARY