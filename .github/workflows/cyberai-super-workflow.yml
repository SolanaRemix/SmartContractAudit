name: CyberAi Super Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (production requires approval)'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
      audit_depth:
        description: 'Audit depth'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - deep

env:
  DRY_RUN: 'true'
  LOG_LEVEL: 'INFO'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  orchestrate:
    name: CyberAi Bot Orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout SmartContractAudit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Environment
        run: |
          echo "Setting up CyberAi Bot environment..."
          
          # Create necessary directories
          mkdir -p logs reports .quarantine
          
          # Make scripts executable with validation
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              # Verify script has valid shebang
              if head -1 "$script" | grep -qE '^#!(/usr/bin/env |/bin/|/usr/bin/)'; then
                chmod +x "$script"
              else
                echo "::warning::Invalid shebang in $script"
              fi
            fi
          done
          
          # NEVER copy .env.example to .env in CI
          # Use environment variables directly
          echo "Environment setup complete"
      
      - name: Install Dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            echo "::error::No lockfile found. Cannot verify dependencies."
            exit 1
          fi
      
      - name: SmartBrain Health Check
        id: health_check
        run: |
          echo "::group::SmartBrain Health Check"
          
          if [ -f scripts/master.sh ]; then
            bash scripts/master.sh health 2>&1 | tee logs/health-check.log
            HEALTH_EXIT=${PIPESTATUS[0]}
            
            if [ "$HEALTH_EXIT" -eq 0 ]; then
              echo "health_status=success" >> $GITHUB_OUTPUT
            else
              echo "health_status=warning" >> $GITHUB_OUTPUT
              echo "::warning::Health check exited with code $HEALTH_EXIT"
            fi
          else
            echo "health_status=skipped" >> $GITHUB_OUTPUT
            echo "::warning::scripts/master.sh not found"
          fi
          
          echo "::endgroup::"
      
      - name: CyberAi Bot — Audit Orchestration
        id: audit
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::group::Audit Orchestration"
          
          AUDIT_MODE="${{ github.event.inputs.mode || 'dry-run' }}"
          AUDIT_DEPTH="${{ github.event.inputs.audit_depth || 'standard' }}"
          
          echo "Audit mode: $AUDIT_MODE"
          echo "Audit depth: $AUDIT_DEPTH"
          
          # ALWAYS run in dry-run mode in CI
          # Production mode REMOVED from workflow_dispatch options
          export DRY_RUN=true
          
          if [ -f scripts/master.sh ]; then
            bash scripts/master.sh audit 2>&1 | tee logs/audit.log
            AUDIT_EXIT=${PIPESTATUS[0]}
            
            if [ -f AUDIT-REPORT.md ]; then
              echo "audit_status=completed" >> $GITHUB_OUTPUT
            else
              echo "audit_status=warning" >> $GITHUB_OUTPUT
            fi
          else
            echo "audit_status=skipped" >> $GITHUB_OUTPUT
          fi
          
          echo "::endgroup::"
      
      - name: CyberAi Bot — Security Scan
        id: security_scan
        run: |
          echo "::group::Security Scan"
          
          if [ -f scripts/master.sh ]; then
            bash scripts/master.sh scan 2>&1 | tee logs/security-scan.log
            SCAN_EXIT=${PIPESTATUS[0]}
            
            if [ -d .quarantine ] && [ "$(ls -A .quarantine 2>/dev/null)" ]; then
              echo "scan_findings=true" >> $GITHUB_OUTPUT
              echo "::warning::Security findings detected — see .quarantine/"
            else
              echo "scan_findings=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "scan_findings=false" >> $GITHUB_OUTPUT
          fi
          
          echo "::endgroup::"
      
      - name: CyberAi Bot — Integrity Check
        id: integrity
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          echo "::group::Integrity Check"
          
          if [ -f scripts/master.sh ]; then
            bash scripts/master.sh integrity 2>&1 | tee logs/integrity.log
            echo "integrity_status=completed" >> $GITHUB_OUTPUT
          else
            echo "integrity_status=skipped" >> $GITHUB_OUTPUT
          fi
          
          echo "::endgroup::"
      
      - name: Aggregate Results
        id: aggregate
        if: always()
        run: |
          echo "::group::Results Aggregation"
          
          cat > reports/cyberai-summary.md <<'ENDOFREPORT'
          # CyberAi Bot Execution Summary
          
          ENDOFREPORT
          
          echo "**Run Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> reports/cyberai-summary.md
          echo "**Trigger**: ${{ github.event_name }}" >> reports/cyberai-summary.md
          echo "**Branch**: ${{ github.ref_name }}" >> reports/cyberai-summary.md
          echo "**Commit**: ${{ github.sha }}" >> reports/cyberai-summary.md
          echo "" >> reports/cyberai-summary.md
          echo "## Results" >> reports/cyberai-summary.md
          echo "" >> reports/cyberai-summary.md
          echo "| Component | Status |" >> reports/cyberai-summary.md
          echo "|-----------|--------|" >> reports/cyberai-summary.md
          echo "| Health Check | ${{ steps.health_check.outputs.health_status || 'skipped' }} |" >> reports/cyberai-summary.md
          echo "| Audit | ${{ steps.audit.outputs.audit_status || 'skipped' }} |" >> reports/cyberai-summary.md
          echo "| Security Scan | ${{ steps.security_scan.outputs.scan_findings == 'true' && '⚠️ Findings' || '✅ Clean' }} |" >> reports/cyberai-summary.md
          echo "| Integrity Check | ${{ steps.integrity.outputs.integrity_status || 'skipped' }} |" >> reports/cyberai-summary.md
          
          cat reports/cyberai-summary.md
          echo "::endgroup::"
      
      - name: Upload Audit Report
        if: steps.audit.outputs.audit_status == 'completed'
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_number }}
          path: AUDIT-REPORT.md
          retention-days: 30
      
      - name: Upload Security Findings
        if: steps.security_scan.outputs.scan_findings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-findings-${{ github.run_number }}
          path: .quarantine/
          retention-days: 90
      
      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberai-summary-${{ github.run_number }}
          path: reports/cyberai-summary.md
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const scanFindings = '${{ steps.security_scan.outputs.scan_findings }}';
            const auditStatus = '${{ steps.audit.outputs.audit_status }}';
            
            let body = '## 🤖 CyberAi Bot Report\n\n';
            
            body += '| Component | Status |\n';
            body += '|-----------|--------|\n';
            body += `| Health Check | ${{ steps.health_check.outputs.health_status || 'skipped' }} |\n`;
            body += `| Audit | ${auditStatus || 'skipped'} |\n`;
            body += `| Security Scan | ${scanFindings === 'true' ? '⚠️ Findings Detected' : '✅ Clean'} |\n`;
            body += `| Integrity Check | ${{ steps.integrity.outputs.integrity_status || 'skipped' }} |\n`;
            
            body += '\n---\n';
            body += `*[View workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*\n`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Job Summary
        if: always()
        run: |
          {
            echo "# 🤖 CyberAi Bot — Execution Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Health Check | ${{ steps.health_check.outputs.health_status || 'skipped' }} |"
            echo "| Audit | ${{ steps.audit.outputs.audit_status || 'skipped' }} |"
            echo "| Security Scan | ${{ steps.security_scan.outputs.scan_findings == 'true' && '⚠️ Findings' || '✅ Clean' }} |"
            echo "| Integrity Check | ${{ steps.integrity.outputs.integrity_status || 'skipped' }} |"
            echo ""
            echo "**Mode:** ${{ github.event.inputs.mode || 'dry-run' }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "## 📁 Artifacts"
            echo ""
            echo "- [Audit Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- [Security Findings](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY
      
      - name: Block on Critical Security Findings
        if: steps.security_scan.outputs.scan_findings == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Critical security findings detected in PR"
          echo "Please review artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      
      # Cleanup
      - name: Cleanup environment
        if: always()
        run: |
          rm -f .env 2>/dev/null || true
          rm -rf logs/ 2>/dev/null || true

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: orchestrate
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push') &&
      needs.orchestrate.result == 'failure'
    
    permissions:
      contents: read
    
    steps:
      - name: Workflow Summary
        run: |
          echo "CyberAi Bot workflow completed with status: ${{ needs.orchestrate.result }}"
          
          if [ "${{ needs.orchestrate.result }}" = "failure" ]; then
            echo "::warning::Workflow failed — check artifacts for details"
          fi